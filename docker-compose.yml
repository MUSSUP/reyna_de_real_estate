# Entorno de desarrollo completo, sin depender de ningún servicio en la nube.
#
#   docker compose up -d
#
# Levanta Postgres y MinIO (almacenamiento compatible con S3) en tu máquina.
# Sirve para trabajar sin internet, para no tocar los datos reales de Supabase,
# y como plan B si algún día hay que mudarse a un VPS propio (RNF-07).
#
# Las credenciales de acá son de desarrollo local y no protegen nada: la base
# no está expuesta a internet. Las de verdad viven en `.env`, que no se versiona.

services:
  db:
    image: postgres:17-alpine
    container_name: reyna-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reyna
      POSTGRES_USER: reyna
      POSTGRES_PASSWORD: reyna_local
    ports:
      - '5432:5432'
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reyna -d reyna']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    container_name: reyna-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reyna_local
      MINIO_ROOT_PASSWORD: reyna_local_secret
    ports:
      - '9000:9000'   # API compatible con S3
      - '9001:9001'   # Panel web de MinIO
    volumes:
      - datos_storage:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket la primera vez y lo deja de lectura pública, igual que
  # está configurado en Supabase. Corre una vez y termina.
  crear-bucket:
    image: minio/mc:latest
    container_name: reyna-crear-bucket
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 reyna_local reyna_local_secret &&
      mc mb --ignore-existing local/reyna-media &&
      mc anonymous set download local/reyna-media &&
      echo 'Bucket reyna-media listo'
      "

volumes:
  datos_db:
  datos_storage:
