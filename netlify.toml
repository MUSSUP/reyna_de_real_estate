# Configuración de despliegue — Reyna de Real Estate

[build]
  command = "npm run build"
  publish = "dist"

  # Quién puede gastar el presupuesto de despliegues.
  #
  # El plan gratuito da **300 créditos por mes y cada despliegue cuesta 15**:
  # veinte por mes, ni uno más. El 18/10 se agotaron los veinte — quince los
  # gastaron commits de desarrollo— y cuando la clienta quiso publicar no
  # quedaba nada. Su herramienta dejó de funcionar por trabajo que no era suyo.
  #
  # Con esto, un despliegue solo arranca si viene del botón "Publicar cambios"
  # del panel —que es para lo que está el presupuesto— o si el mensaje del
  # commit lo pide con [desplegar].
  #
  # Netlify lee esta orden al revés de lo que uno espera:
  #   salir con 0          → **cancela** el despliegue
  #   salir con otra cosa  → lo deja seguir
  #
  # **Falla del lado seguro, y está probado.** Si no se puede leer el mensaje
  # del commit —git no responde, la referencia no existe— sale con 1 y el
  # despliegue se hace igual. La primera versión hacía lo contrario: ante un
  # error se salteaba, que es el peor final posible — la clienta se queda sin
  # publicar y nada se lo avisa.
  #
  # **Dos efectos laterales que hay que conocer, porque no avisan:**
  #
  # 1. Un despliegue lanzado a mano desde el panel de Netlify ("Trigger
  #    deploy") **se cancela en silencio** si el mensaje del último commit no
  #    lleva [desplegar]. En el panel se ve como un despliegue que terminó sin
  #    construir nada, no como un error. Para desplegar a mano: poner la marca
  #    en el commit, o usar el botón del panel de administración.
  # 2. Netlify lee este archivo **del commit que está construyendo**, no del
  #    último. O sea que la regla se aplica a sí misma: si el commit de más
  #    arriba no lleva la marca, se saltea su propio despliegue. Ya pasó dos
  #    veces, la segunda por agregar un commit encima de uno que sí la tenía.
  #    **Antes de empujar, verificar que el mensaje de arriba la lleve.**
  # 3. La búsqueda es de texto y abarca **todo el mensaje**, no sólo la
  #    primera línea. O sea que **mencionar la marca alcanza para dispararla**:
  #    un commit que explique en su cuerpo "la marca va en el commit del
  #    dominio" se despliega solo. Para hablar de ella sin activarla, nombrarla
  #    sin los corchetes.
  #
  # La cadena va entre comillas simples triples: TOML no toca lo de adentro.
  ignore = '''
    if [ -n "$INCOMING_HOOK_TITLE" ]; then exit 1; fi
    MENSAJE=$(git log -1 --format=%B "$COMMIT_REF" 2>/dev/null) || exit 1
    case "$MENSAJE" in *"[desplegar]"*) exit 1 ;; esac
    exit 0
  '''

# Funciones propias, aparte de las que genera Astro. Por ahora solo la que
# mantiene despierto el proyecto de Supabase.
[functions]
  directory = "netlify/functions"

[build.environment]
  # Netlify no usa la versión de Node del equipo de desarrollo.
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Cabeceras de seguridad
#
# Se aplican a todo el sitio. Cada una cierra una puerta concreta.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # ENSAYO — QUITAR ANTES DE LA ENTREGA (acción A-11).
    # El sitio muestra datos de demostración: no debe aparecer en buscadores
    # hasta tener contenido real. Va junto con `frontend/public/robots.txt`,
    # que también hay que borrar. Esta cabecera es la que de verdad frena a
    # Google; el robots.txt solo pide que no entre.
    X-Robots-Tag = "noindex, nofollow"

    # El navegador solo carga recursos de donde decimos. Si alguien lograra
    # inyectar un script apuntando a otro servidor, no se ejecutaría.
    #   'unsafe-inline' en estilos es necesario: Astro incrusta CSS crítico.
    #   Los scripts NO lo llevan — ahí está el riesgo real.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

    # Nadie puede meter el sitio dentro de un marco en otra página para
    # engañar a un visitante haciéndole apretar algo que no ve.
    X-Frame-Options = "DENY"

    # El navegador respeta el tipo de archivo que declaramos y no intenta
    # adivinarlo — evita que un archivo subido se ejecute como otra cosa.
    X-Content-Type-Options = "nosniff"

    # Al salir del sitio no se filtra la dirección exacta que estaba viendo.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # El sitio no necesita cámara, micrófono ni ubicación: se apagan.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

    # Un año de HTTPS obligatorio. Ni siquiera el primer pedido viaja en claro.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Las respuestas del panel y del formulario nunca se cachean: llevan datos
# de sesión y de consultas.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

# El panel no se indexa.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, max-age=0"

# Las rutas con identificador único en el nombre no cambian de contenido:
# se cachean para siempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Redirecciones
# ---------------------------------------------------------------------------

# Una sola dirección canónica: sin www. Evita contenido duplicado para
# los buscadores.
# La dirección vieja del aviso de consulta no enviada. Pasó de ser una página
# con el motivo en la query a una por motivo, generada al construir, para que
# no necesite la base justo cuando la base es lo que falló.
[[redirects]]
  from = "/consulta-no-enviada"
  to = "/consulta-no-enviada/error"
  status = 301

[[redirects]]
  from = "https://www.reynaderealestate.com/*"
  to = "https://reynaderealestate.com/:splat"
  status = 301
  force = true
